<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sana Küçük Bir Şey Hazırladım ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(
          rgba(20, 10, 30, 0.55),
          rgba(30, 10, 25, 0.75)
        ),
        url("https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1600&q=80");

      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }

    .card {
      width: 90%;
      max-width: 430px;
      padding: 40px 25px;
      border-radius: 25px;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);

      border: 1px solid rgba(255, 255, 255, 0.25);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

      animation: appear 1.5s ease;
    }

    .heart {
      font-size: 65px;
      animation: beat 1.2s infinite;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      opacity: 0.95;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 15px 28px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;

      background: white;
      color: #c2185b;

      font-weight: bold;

      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #surprise {
      margin-top: 25px;
      font-size: 20px;
      display: none;
      animation: appear 1s ease;
    }

    .floating-heart {
      position: absolute;
      bottom: -30px;
      font-size: 20px;
      animation: floatUp linear forwards;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes beat {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

    }

    @keyframes floatUp {

      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }

    }

  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Merhaba, Elif</h1>

    <p>
      Sana sıradan bir mesaj göndermek istemedim.
      Bu yüzden küçük bir şey hazırlamak istedim.
      <br><br>

      Çünkü bazı insanlar vardır...
      Onlarla konuşurken zamanın nasıl geçtiğini fark etmezsin.
    </p>

    <button onclick="surprise()">
      Sana Bir Şey Söyleyeceğim
    </button>

    <div id="surprise">

      ✨ İyi ki seni tanımışım. ✨

      <br><br>

      Belki bu sayfa küçük bir şey...
      <br>

      ama seni gülümsettiyse amacına ulaştı. ❤️

    </div>

  </div>


  <script>

    function surprise() {

      document.getElementById("surprise").style.display = "block";

      createHearts();

    }


    function createHearts() {

      for (let i = 0; i < 25; i++) {

        setTimeout(() => {

          const heart = document.createElement("div");

          heart.classList.add("floating-heart");

          heart.innerHTML = "❤️";

          heart.style.left =
            Math.random() * 100 + "vw";

          heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

          heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

          document.body.appendChild(heart);


          setTimeout(() => {

            heart.remove();

          }, 7000);

        }, i * 150);

      }

    }

  </script>

</body>
</html>
